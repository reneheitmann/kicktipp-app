name: Docker Image bauen und veröffentlichen

# Baut bei jedem Push nach main ODER beta automatisch ein neues, EINZIGES
# Docker-Image, das DREI Versionen gleichzeitig enthält: main unter /, beta
# unter /beta/, dev unter /dev/ (siehe Dockerfile/nginx.conf.template) – ein
# Container/eine Adresse statt getrennter Images/Container. Wer welchen Pfad
# sehen darf, entscheidet die App selbst (siehe beta.access-Recht,
# src/App.tsx – dev braucht keine solche Freischaltung, da es auf ein
# komplett eigenständiges Supabase-Projekt mit eigener Anmeldung zeigt).
# Tags: immer :latest und :<sha>, unabhängig davon, welcher Branch den Build
# ausgelöst hat.
#
# Dafür werden main UND beta in JEDEM Lauf unabhängig voneinander in eigene
# Unterverzeichnisse ausgecheckt und einzeln gebaut (build-main/build-beta) –
# der jeweils NICHT gepushte Branch wird dabei einfach in seinem aktuellen
# Stand mitgebaut, nicht neu verifiziert (der hat seine eigene Lint/Test-
# Prüfung schon bei seinem letzten Push durchlaufen). dev bekommt bewusst
# KEINEN eigenen Checkout: es ist exakt derselbe Commit wie beta (die
# separate "Kicktipp Dev"-Datenbank trackt die aktive Entwicklung, neue
# Migrationen laufen dort immer zuerst), nur ein zweiter Build desselben
# Checkouts mit anderen VITE_SUPABASE_*-Werten und eigenem --outDir.
#
# Nur beim Bauen von main wird zusätzlich automatisch die Version in
# package.json erhöht, außer package.json wurde im selben Push bereits selbst
# geändert (z. B. um bewusst auf eine neue Major-Version zu springen) – dann
# bleibt die manuell gesetzte Version unangetastet. Enthält der Push neue
# Dateien unter supabase/migrations/ (also ein DB-Update), wird die
# MINOR-Version erhöht (z. B. 1.1.9 -> 1.2.0), sonst nur die Patch-Version
# (z. B. 1.1.9 -> 1.1.10) – so ist an der Versionsnummer selbst ablesbar, ob
# ein Release ein Datenbank-Update enthielt. Der Versions-Bump wird mit
# "[skip ci]" zurückcommitted, damit das keinen weiteren Workflow-Lauf
# auslöst (von GitHub Actions nativ unterstützt).
#
# Beta-Builds bumpen package.json bewusst NIE (würde bei jedem Merge mit main
# zu Versions-Konflikten in der Datei führen) – stattdessen hängt
# vite.config.ts an die zuletzt von main gemergte Versionsnummer
# "_beta.<Commit-Anzahl auf beta>" an, sodass die angezeigte Version trotzdem
# bei jedem Beta-Push sichtbar hochzählt (z. B. "1.1.7_beta.42").
#
# Lint (oxlint) und Tests (vitest) laufen vor dem eigentlichen Image-Build und
# blockieren ihn bei Fehlern.

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: main auschecken
        uses: actions/checkout@v4
        with:
          ref: main
          path: build-main
          fetch-depth: 0

      - name: beta auschecken
        uses: actions/checkout@v4
        with:
          ref: beta
          path: build-beta
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Beide Checkouts liegen in Unterordnern (build-main/build-beta,
          # siehe oben) statt im Workspace-Root – ohne explizite Pfade findet
          # setup-node dort kein package-lock.json.
          cache-dependency-path: |
            build-main/package-lock.json
            build-beta/package-lock.json

      - name: Abhängigkeiten installieren (main)
        working-directory: build-main
        run: npm ci

      - name: Abhängigkeiten installieren (beta)
        working-directory: build-beta
        run: npm ci

      # Zunächst bewusst nicht blockierend (continue-on-error): bestehende,
      # noch ungefixte Findings in Transitive-Dependencies sollen nicht sofort
      # jeden Deploy stoppen, aber im Log sichtbar bleiben. Läuft für BEIDE
      # Branches (nicht nur den auslösenden), da package-lock.json auf main
      # und beta unabhängig voneinander driften kann.
      - name: Dependency-Audit (main)
        working-directory: build-main
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Dependency-Audit (beta)
        working-directory: build-beta
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Getriggerten Checkout ermitteln
        id: triggered
        run: echo "dir=${{ github.ref_name == 'main' && 'build-main' || 'build-beta' }}" >> "$GITHUB_OUTPUT"

      - name: Lint prüfen
        working-directory: ${{ steps.triggered.outputs.dir }}
        run: npm run lint

      - name: Tests ausführen
        working-directory: ${{ steps.triggered.outputs.dir }}
        run: npm run test

      - name: Version automatisch erhöhen (nur main)
        id: bump
        if: github.ref == 'refs/heads/main'
        working-directory: build-main
        run: |
          CURRENT=$(node -p "require('./package.json').version")

          # Nur das version-Feld selbst zählt als "bereits manuell geändert"
          # (z. B. bewusster Sprung auf eine neue Major-Version) – ein reiner
          # `git diff --name-only`-Check auf die ganze Datei würde hier
          # fälschlich auch dann greifen, wenn package.json sich aus anderem
          # Grund geändert hat (z. B. eine von beta gemergte neue
          # devDependency), und den Bump dann stumm überspringen.
          PREVIOUS_VERSION=""
          if [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            PREVIOUS_VERSION=$(git show "${{ github.event.before }}:package.json" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).version))" 2>/dev/null || echo "")
          fi

          if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "$CURRENT" ]; then
            echo "version-Feld wurde in diesem Push bereits manuell geändert ($PREVIOUS_VERSION -> $CURRENT) – keine automatische Erhöhung."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            HAS_NEW_MIGRATION=false
            if [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
              if git diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations/ | grep -q .; then
                HAS_NEW_MIGRATION=true
              fi
            fi

            if [ "$HAS_NEW_MIGRATION" = true ]; then
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              echo "Neue DB-Migration erkannt – Minor-Version erhöht: $CURRENT -> $NEW_VERSION"
            else
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              echo "Version erhöht: $CURRENT -> $NEW_VERSION"
            fi

            npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prod-Version ermitteln (Basis für die Beta-Versionsanzeige)
        id: prod_version
        working-directory: build-main
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Build-Metadaten ermitteln
        id: meta
        run: |
          echo "commit_sha_main=$(git -C build-main rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_sha_beta=$(git -C build-beta rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: main-Historie in build-beta nachladen (für Versions-Changelog)
        # .github/scripts/generate-changelog.cjs braucht origin/main als
        # verlässliche Versions-Historie (siehe dortiger Kommentar) – beim
        # main-Checkout automatisch vorhanden, beim beta-Checkout nicht.
        working-directory: build-beta
        run: git fetch origin main

      - name: Änderungsprotokoll (Prod) ermitteln
        id: changelog_prod
        working-directory: build-main
        # Branch als CLI-Argument statt env: GITHUB_REF_NAME – siehe
        # Kommentar in generate-changelog.cjs, ein step-level env-Override
        # dieser vordefinierten Variable griff nicht zuverlässig.
        run: |
          JSON=$(node .github/scripts/generate-changelog.cjs main)
          ENCODED=$(printf '%s' "$JSON" | base64 | tr -d '\n')
          echo "changelog=$ENCODED" >> "$GITHUB_OUTPUT"

      - name: Änderungsprotokoll (Beta) ermitteln
        id: changelog_beta
        working-directory: build-beta
        run: |
          JSON=$(node .github/scripts/generate-changelog.cjs beta)
          ENCODED=$(printf '%s' "$JSON" | base64 | tr -d '\n')
          echo "changelog=$ENCODED" >> "$GITHUB_OUTPUT"

      - name: Prod-Bundle bauen (main)
        working-directory: build-main
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_COMMIT_SHA: ${{ steps.meta.outputs.commit_sha_main }}
          VITE_APP_BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          VITE_APP_CHANNEL: production
          VITE_APP_CHANGELOG: ${{ steps.changelog_prod.outputs.changelog }}
        run: npm run build

      # instance-info.json (siehe scripts/generate-instance-info.mjs,
      # docs/mobile-app.md): Verbindungsdaten, über die die mobile App eine
      # eingegebene Domain zu dieser Instanz auflöst. Existenz-Check statt
      # fixem Aufruf, da dieser Schritt zunächst nur auf beta ankommt (siehe
      # Kommentar oben zu build-main/build-beta) – wird beim nächsten
      # beta->main-Merge automatisch mit aktiv, kein zweiter Schritt nötig.
      - name: instance-info.json erzeugen (main)
        working-directory: build-main
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -f scripts/generate-instance-info.mjs ]; then
            npm run build:instance-info
          else
            echo "scripts/generate-instance-info.mjs noch nicht auf main vorhanden - übersprungen."
          fi

      - name: Beta-Build-Metadaten ermitteln
        id: beta_meta
        working-directory: build-beta
        run: echo "build_number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Beta-Bundle bauen (beta)
        working-directory: build-beta
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_COMMIT_SHA: ${{ steps.meta.outputs.commit_sha_beta }}
          VITE_APP_BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          VITE_APP_CHANNEL: beta
          VITE_APP_CHANGELOG: ${{ steps.changelog_beta.outputs.changelog }}
          VITE_APP_BETA_BUILD_NUMBER: ${{ steps.beta_meta.outputs.build_number }}
          VITE_APP_BETA_BASE_VERSION: ${{ steps.prod_version.outputs.version }}
        run: npm run build

      - name: instance-info.json erzeugen (beta)
        working-directory: build-beta
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:instance-info

      # Dev nutzt bewusst denselben build-beta-Checkout (siehe Kommentar ganz
      # oben) statt eines eigenen dritten Checkouts – erspart einen weiteren
      # npm-ci-Lauf für exakt denselben Commit. --outDir sorgt dafür, dass
      # der reguläre Beta-Build (dist/, bereits oben abgeschlossen) dabei
      # nicht überschrieben wird.
      - name: Dev-Bundle bauen (dev, aus dem beta-Checkout, eigenständiges Supabase-Projekt)
        working-directory: build-beta
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_DEV }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_DEV }}
          VITE_APP_COMMIT_SHA: ${{ steps.meta.outputs.commit_sha_beta }}
          VITE_APP_BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          VITE_APP_CHANNEL: dev
          VITE_APP_CHANGELOG: ${{ steps.changelog_beta.outputs.changelog }}
        run: npm run build -- --outDir dist-dev

      - name: instance-info.json erzeugen (dev)
        working-directory: build-beta
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_DEV }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_DEV }}
        # Kein "npm run build:instance-info" hier: das Skript hat "dist" fest
        # als Zielordner einprogrammiert (siehe scripts/generate-instance-
        # info.mjs, für main/beta korrekt, da deren --outDir Default bleibt),
        # ein via "--" angehängtes zweites Argument würde nur zusätzlich zum
        # fest kodierten "dist" übergeben, nicht es ersetzen.
        run: node scripts/generate-instance-info.mjs dist-dev

      - name: Builds für den Docker-Kontext bereitstellen
        # Der Workspace-Root selbst hat kein eigenes Checkout mehr (beide
        # Branches liegen nur unter build-main/build-beta) – Dockerfile und
        # nginx.conf.template müssen daher explizit hierher kopiert werden,
        # sonst findet docker/build-push-action mit context: . kein
        # Dockerfile. Quelle ist bewusst der Checkout des AUSLÖSENDEN Branches
        # (wie beim Lint/Test-Schritt oben), nicht immer build-main: solange
        # diese Umstellung selbst noch nicht nach main gemergt ist, hat nur
        # build-beta das neue, schlanke Dockerfile – build-main hätte hier
        # noch die alte Node-Build-Stage-Version.
        run: |
          cp -r build-main/dist ./dist-prod
          cp -r build-beta/dist ./dist-beta
          cp -r build-beta/dist-dev ./dist-dev
          cp ${{ steps.triggered.outputs.dir }}/Dockerfile ./Dockerfile
          cp ${{ steps.triggered.outputs.dir }}/nginx.conf.template ./nginx.conf.template

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Zunächst bewusst nicht blockierend (continue-on-error + exit-code 0):
      # Findings sollen im Log sichtbar sein, aber bestehende, noch
      # ungefixte Basis-Image-CVEs nicht sofort jeden Deploy stoppen. Scannt
      # das eben gepushte :<sha>-Tag direkt aus der Registry (kein
      # zusätzliches load: true nötig, docker/login-action oben hat den
      # Runner bereits bei ghcr.io angemeldet).
      - name: Container-Image scannen (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Versions-Bump zurück ins Repo committen
        if: github.ref == 'refs/heads/main' && steps.bump.outputs.bumped == 'true'
        working-directory: build-main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version") [skip ci]"
          git push
