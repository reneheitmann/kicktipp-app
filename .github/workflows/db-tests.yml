name: Datenbank-Tests

# pgTAP-Tests für die Postgres-Funktionen (aktuell: calculate_matchday_payout/
# calculate_season_payout, supabase/migrations/0012_tie_aware_payout_calculation.sql),
# siehe supabase/tests/database/. Läuft komplett gegen eine frische, aus den
# Migrationen aufgebaute LOKALE Datenbank in einem GitHub-gehosteten Runner
# (Docker ist dort vorinstalliert, siehe db-backup.yml) - kein Zugriff auf
# Dev/beta/prod nötig, daher auch keine Supabase-Secrets hier.
#
# Bewusst eigenständig statt docker-publish.yml zu erweitern: andere Ebene
# (DB-Migrationen vs. Frontend-Bundle), keine echte Abhängigkeit zwischen
# beiden Pipelines.

on:
  push:
    branches: [main, beta]
    paths:
      - "supabase/**"
  pull_request:
    paths:
      - "supabase/**"

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Lokale Datenbank starten (nur der db-Container, Rest unnötig für pgTAP)
        run: |
          supabase start \
            -x analytics -x edge-runtime -x functions -x imgproxy \
            -x inbucket -x kong -x meta -x realtime -x rest -x storage \
            -x studio -x vector

      - name: pgTAP-Suite ausführen
        run: supabase test db --local supabase/tests/database
